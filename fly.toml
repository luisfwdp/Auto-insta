# Fly.io app for the CRIA PING worker (npm run worker). See docs/fly-worker.md.
#
# One always-on Machine with no public services: the worker only connects out
# to Postgres, Redis and the Meta Graph API. The web app stays on Vercel.
# Secrets (DATABASE_URL, REDIS_URL, ENCRYPTION_KEY, ...) are set with
# `fly secrets set`, never in this file.

app = "criaping-worker"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile.worker"

[env]
  NODE_ENV = "production"

# Restart the worker whenever it exits, not only on crashes: a stopped worker
# means no DM is sent while webhooks keep arriving.
[[restart]]
  policy = "always"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
